id: Grep
name: Grep
description: |-
  A powerful search tool built on ripgrep

  Usage:
  - ALWAYS use Grep for search tasks. NEVER invoke `grep` or `rg` as a Bash command. The Grep tool has been optimized for correct permissions and access.
  - Supports full regex syntax (e.g., "log.*Error", "function\\s+\\w+")
  - Filter files with glob parameter (e.g., "*.js", "**/*.tsx") or type parameter (e.g., "js", "py", "rust")
  - Output modes: "content" shows matching lines, "files_with_matches" shows only file paths (default), "count" shows match counts
  - Use Agent tool for open-ended searches requiring multiple rounds
  - Pattern syntax: Uses ripgrep (not grep) - literal braces need escaping (use `interface\\{\\}` to find `interface{}` in Go code)
  - Multiline matching: By default patterns match within single lines only. For cross-line patterns like `struct \\{[\\s\\S]*?field`, use `multiline: true`
handler: runtime:claude_grep
approval_policy: auto
sandbox_policy: read-only
contract:
  status: active
  trust_level: sandboxed
  side_effect_class: none
  reversibility: not_applicable
  idempotency: idempotent
  risk_level: low
  preconditions:
    - pattern is a valid ripgrep-compatible regular expression.
    - path, glob, and type filters identify readable files within the active sandbox.
    - multiline mode is enabled only when cross-line matching is required.
  postconditions:
    - filesystem contents are unchanged.
    - matching content, matching file paths, counts, or a search error are returned.
  semantic_intents:
    - intent: search_text
      slots:
        pattern: pattern
      optional_slots:
        path: path
      defaults:
        output_mode: content
        head_limit: 200
  verification:
    methods:
      - refine path, glob, type, or output_mode when results are unexpectedly broad or empty.
      - use Read on relevant matches before relying on surrounding file context.
    required_before_completion: false
  failure_modes:
    - name: invalid_pattern
      detection: "text_contains:invalid regular expression || text_contains:regex parse error"
      repair_strategy: simplify or escape the search pattern before retrying.
      confidence: 0.8
    - name: missing_path
      detection: "text_contains:no such file or directory || text_contains:path does not exist || text_contains:cannot find the path"
      repair_strategy: inspect available paths before retrying with a corrected path.
      confidence: 0.85
    - name: truncated_output
      detection: "text_contains:truncated || text_contains:head_limit"
      repair_strategy: narrow path, glob, or output_mode before retrying.
      confidence: 0.7
    - name: skipped_content
      detection: binary or ignored files are not searched by default ripgrep behavior.
      repair_strategy: adjust search options or read a specific candidate file.
      confidence: 0.5
  forbidden_uses:
    - modifying files or directories.
    - using search results as a substitute for reading the exact file context before editing.
input_schema:
  type: object
  properties:
    pattern:
      type: string
      description: The regular expression pattern to search for in file contents
    path:
      type: string
      description: File or directory to search in (rg PATH). Defaults to current working directory.
    glob:
      type: string
      description: Glob pattern to filter files (e.g. "*.js", "*.{ts,tsx}") - maps to rg --glob
    output_mode:
      type: string
      enum:
        - content
        - files_with_matches
        - count
      description: |-
        Output mode: "content" shows matching lines (supports -A/-B/-C
        context, -n line numbers, head_limit), "files_with_matches" shows file
        paths (supports head_limit), "count" shows match counts (supports
        head_limit). Defaults to "files_with_matches".
    "-B":
      type: integer
      description: |-
        Number of lines to show before each match (rg -B). Requires
        output_mode: "content", ignored otherwise.
    "-A":
      type: integer
      description: |-
        Number of lines to show after each match (rg -A). Requires
        output_mode: "content", ignored otherwise.
    "-C":
      type: integer
      description: Alias for context.
    context:
      type: integer
      description: |-
        Number of lines to show before and after each match (rg -C). Requires
        output_mode: "content", ignored otherwise.
    "-n":
      type: boolean
      description: |-
        Show line numbers in output (rg -n). Requires output_mode: "content",
        ignored otherwise. Defaults to true.
    "-i":
      type: boolean
      description: Case insensitive search (rg -i).
    type:
      type: string
      description: |-
        File type to search (rg --type). Common types: js, py, rust, go, java,
        etc. More efficient than include for standard file types.
    head_limit:
      type: integer
      description: |-
        Limit output to first N lines/entries, equivalent to "| head -N".
        Works across all output modes: content (limits output lines),
        files_with_matches (limits file paths), count (limits count entries).
        Defaults to 250 when unspecified. Pass 0 for unlimited (use sparingly
        - large result sets waste context).
    offset:
      type: integer
      description: |-
        Skip first N lines/entries before applying head_limit, equivalent to
        "| tail -n +N | head -N". Works across all output modes. Defaults to 0.
    multiline:
      type: boolean
      description: |-
        Enable multiline mode where . matches newlines and patterns can span
        lines (rg -U --multiline-dotall). Default: false.
  required:
    - pattern
  additionalProperties: false
