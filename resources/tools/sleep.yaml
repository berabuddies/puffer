id: Sleep
name: Sleep
description: |-
  Wait for a specified duration. The user can interrupt the sleep at any time.

  Use this when the user tells you to sleep or rest, when you have nothing to do, or when you're waiting for something.

  You may receive <tick> prompts — these are periodic check-ins. Look for useful work to do before sleeping.

  You can call this concurrently with other tools — it won't interfere with them.

  Prefer this over `Bash(sleep ...)` — it doesn't hold a shell process.

  Each wake-up costs an API call, but the prompt cache expires after 5 minutes of inactivity — balance accordingly.
handler: runtime:sleep
approval_policy: never
sandbox_policy: read-only
contract:
  side_effect_class: pure_observation
  reversibility: irreversible
  idempotency: non_idempotent
  risk_level: low
  postconditions:
    - elapsed time is observed
  verification:
    methods:
      - confirm the sleep completed or was interrupted
    required_before_completion: false
  semantic_intents:
    - intent: await_async_progress
      defaults:
        duration_ms: 1000
  approval:
    required: false
input_schema:
  type: object
  properties:
    duration_ms:
      type: integer
      minimum: 1
      maximum: 300000
      description: Duration to wait in milliseconds.
    reason:
      type: string
      description: Optional note describing why the wait is needed.
  required:
    - duration_ms
  additionalProperties: false
