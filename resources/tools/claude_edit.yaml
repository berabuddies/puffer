id: Edit
name: Edit
description: |-
  Performs exact string replacements in files.

  Usage:
  - You must use your `Read` tool at least once in the conversation before editing. This tool will error if you attempt an edit without reading the file.
  - When editing text from Read tool output, ensure you preserve the exact indentation (tabs/spaces) as it appears AFTER the line number prefix. The line number prefix format is: line number + tab. Everything after that is the actual file content to match. Never include any part of the line number prefix in the old_string or new_string.
  - ALWAYS prefer editing existing files in the codebase. NEVER write new files unless explicitly required.
  - Only use emojis if the user explicitly requests it. Avoid adding emojis to files unless asked.
  - The edit will FAIL if `old_string` is not unique in the file. Either provide a larger string with more surrounding context to make it unique or use `replace_all` to change every instance of `old_string`.
  - Use `replace_all` for replacing and renaming strings across the file. This parameter is useful if you want to rename a variable for instance.
handler: runtime:claude_edit
approval_policy: on-request
sandbox_policy: workspace-write
contract:
  status: active
  trust_level: sandboxed
  side_effect_class: filesystem-write
  reversibility: conditional
  idempotency: conditionally_idempotent
  risk_level: medium
  preconditions:
    - file_path is an absolute path.
    - target file has been read in the conversation before editing.
    - old_string exactly matches existing file content.
    - old_string is unique unless replace_all is intentionally enabled.
  postconditions:
    - matching text is replaced with new_string on success.
    - unrelated file content is preserved on success.
    - no change is made if the required match conditions fail.
  verification:
    methods:
      - read the edited region after modification when content correctness matters.
      - inspect version control diff for tracked files.
    templates:
      - contract_id: puffer.tools
        action_name: Read
        args:
          file_path: "{arg.file_path}"
        reason: read the edited file from disk.
    required_before_completion: true
  failure_modes:
    - name: permission_denied
      detection: "text_contains:permission denied || text_contains:operation not permitted || text_contains:sandbox"
      repair_strategy: choose a lower-privilege edit path or request explicit approval.
      confidence: 0.8
    - name: missing_precondition
      detection: "text_contains:must read || text_contains:not read before editing"
      repair_strategy: read the target file before retrying the edit.
      confidence: 0.85
    - name: match_failed
      detection: "text_contains:old_string || text_contains:pattern not found || text_contains:ambiguous"
      repair_strategy: read exact surrounding context before retrying with a precise match.
      confidence: 0.8
    - name: concurrent_change
      detection: "text_contains:concurrent || text_contains:modified since"
      repair_strategy: re-read the file and recalculate the edit.
      confidence: 0.7
  forbidden_uses:
    - broad replacements without confirming intended scope.
    - editing generated, vendored, or unrelated user files without explicit need.
    - writing secrets, credentials, or tokens unless explicitly requested and appropriate.
  argument_safety:
    - source_arg: file_path
      blocked_patterns:
        - name: protected_system_path
          pattern: '^/(proc|sys|dev|run|boot|etc|usr|bin|sbin|lib|lib64)(/|$)'
          reason: protected system locations are outside normal workspace edits.
          confidence: 0.95
        - name: parent_traversal
          pattern: '(^|/)\.\.(/|$)'
          reason: parent traversal makes the edit target ambiguous.
          confidence: 0.9
      approval_patterns:
        - name: version_control_metadata
          pattern: '(^|/)\.git(/|$)'
          reason: modifying version-control metadata requires explicit approval.
          confidence: 0.95
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: The absolute path to the file to modify
    old_string:
      type: string
      description: The text to replace
    new_string:
      type: string
      description: The text to replace it with (must be different from old_string)
    replace_all:
      type: boolean
      description: Replace all occurrences of old_string (default false)
  required:
    - file_path
    - old_string
    - new_string
  additionalProperties: false
