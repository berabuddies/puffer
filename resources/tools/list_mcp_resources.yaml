id: ListMcpResourcesTool
name: ListMcpResourcesTool
description: |-
  List available resources from configured MCP servers.
  Each returned resource will include all standard MCP resource fields plus a 'server' field 
  indicating which server the resource belongs to.

  Parameters:
  - server (optional): The name of a specific MCP server to get resources from. If not provided,
    resources from all servers will be returned.
handler: runtime:list_mcp_resources
approval_policy: auto
sandbox_policy: read-only
contract:
  side_effect_class: external_read
  reversibility: reversible
  idempotency: unknown
  risk_level: medium
  preconditions:
    - requested MCP server must be configured and reachable
  postconditions:
    - MCP resource metadata is observed but not modified
  verification:
    methods:
      - confirm returned resources are from the requested MCP server when a server filter is supplied
      - inspect resource metadata before relying on a specific resource URI
    required_before_completion: false
  approval:
    required: false
input_schema:
  type: object
  properties:
    server:
      type: string
      description: Optional server name to filter resources by
