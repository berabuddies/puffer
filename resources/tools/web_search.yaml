id: WebSearch
name: WebSearch
description: |-
  - Allows Claude to search the web and use the results to inform responses
  - Provides up-to-date information for current events and recent data
  - Returns search result information formatted as search result blocks, including links as markdown hyperlinks
  - Use this tool for accessing information beyond Claude's knowledge cutoff
  - Searches are performed automatically within a single API call

  CRITICAL REQUIREMENT - You MUST follow this:
    - After answering the user's question, you MUST include a "Sources:" section at the end of your response
    - In the Sources section, list all relevant URLs from the search results as markdown hyperlinks: [Title](URL)
    - This is MANDATORY - never skip including sources in your response
    - Example format:

      [Your answer here]

      Sources:
      - [Source Title 1](https://example.com/1)
      - [Source Title 2](https://example.com/2)

  Usage notes:
    - Domain filtering is supported to include or block specific websites
    - Web search is only available in the US

  IMPORTANT - Use the correct year in search queries:
    - The current month is {{CURRENT_MONTH_YEAR}}. You MUST use this year when searching for recent information, documentation, or current events.
    - Example: If the user asks for "latest React docs", search for "React documentation" with the current year, NOT last year
handler: provider:web_search
approval_policy: auto
sandbox_policy: read-only
contract:
  side_effect_class: external_read
  reversibility: reversible
  idempotency: unknown
  risk_level: medium
  postconditions:
    - external search result metadata is observed but not modified
  verification:
    methods:
      - observation:json_bool:success=true
      - observation:non_empty:stdout
      - cite relevant result URLs in the final response
      - open or corroborate sources before relying on high-impact claims
    required_before_completion: true
  approval:
    required: false
input_schema:
  type: object
  properties:
    query:
      type: string
      description: The search query to use.
      minLength: 2
    allowed_domains:
      type: array
      description: Only include search results from these domains.
      items:
        type: string
    blocked_domains:
      type: array
      description: Never include search results from these domains.
      items:
        type: string
  required:
    - query
  additionalProperties: false
