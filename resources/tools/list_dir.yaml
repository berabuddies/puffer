id: list_dir
name: list_dir
description: List files and directories from the workspace.
handler: list_dir
approval_policy: auto
sandbox_policy: read-only
contract:
  side_effect_class: local_read
  reversibility: reversible
  idempotency: idempotent
  risk_level: low
  verification:
    methods:
      - confirm returned entries are inside requested workspace path
    required_before_completion: false
  approval:
    required: false
enabled_if: never
