id: NotebookEdit
name: NotebookEdit
description: |-
  Completely replaces the contents of a specific cell in a Jupyter notebook
  (.ipynb file) with new source.

  Jupyter notebooks combine code, text, and visualizations for data analysis
  and scientific computing.

  Usage:
  - `notebook_path` must be an absolute path.
  - Read the notebook with `Read` before editing it. This tool fails if the
    notebook has not been fully read or if it changed after it was read.
  - `cell_id` identifies the target cell. Existing cell ids and `cell-N` or
    numeric index fallbacks are accepted.
  - Use `edit_mode: "insert"` to add a new cell after `cell_id`, or at the
    beginning if `cell_id` is omitted.
  - Use `edit_mode: "delete"` to remove the target cell.
  - `cell_type` is required when inserting and may be `code` or `markdown`.
handler: runtime:notebook_edit
approval_policy: on-request
sandbox_policy: workspace-write
contract:
  side_effect_class: local_write
  reversibility: conditionally_reversible
  idempotency: non_idempotent
  risk_level: medium
  preconditions:
    - notebook_path must be an absolute path inside the allowed workspace
    - target notebook must have been read before editing when preserving existing cells matters
    - edit_mode, cell_id, cell_type, and new_source must describe the intended notebook cell change
  postconditions:
    - target notebook cell content, structure, or ordering may change
    - unrelated notebook cells should be preserved on success
  verification:
    methods:
      - read the notebook after editing when cell content or ordering matters
      - inspect version control diff for tracked notebooks
    templates:
      - contract_id: puffer.tools
        action_name: Read
        args:
          file_path: "{arg.notebook_path}"
        reason: read the edited notebook from disk.
    required_before_completion: true
  approval:
    required: true
    reason: modifies workspace notebook files
  argument_safety:
    - source_arg: notebook_path
      blocked_patterns:
        - name: protected_system_path
          pattern: '^/(proc|sys|dev|run|boot|etc|usr|bin|sbin|lib|lib64)(/|$)'
          reason: protected system locations are outside normal workspace notebook edits.
          confidence: 0.95
        - name: parent_traversal
          pattern: '(^|/)\.\.(/|$)'
          reason: parent traversal makes the notebook edit target ambiguous.
          confidence: 0.9
      approval_patterns:
        - name: version_control_metadata
          pattern: '(^|/)\.git(/|$)'
          reason: modifying version-control metadata requires explicit approval.
          confidence: 0.95
input_schema:
  type: object
  properties:
    notebook_path:
      type: string
      description: The absolute path to the Jupyter notebook file to edit (must be absolute, not relative).
    cell_id:
      type: string
      description: The ID of the cell to edit. When inserting a new cell, the new cell will be inserted after the cell with this ID, or at the beginning if not specified.
    new_source:
      type: string
      description: The new source for the cell.
    cell_type:
      type: string
      enum:
        - code
        - markdown
      description: The type of the cell (code or markdown). If not specified, it defaults to the current cell type. If using edit_mode=insert, this is required.
    edit_mode:
      type: string
      enum:
        - replace
        - insert
        - delete
      description: The type of edit to make (replace, insert, delete). Defaults to replace.
  required:
    - notebook_path
    - new_source
  additionalProperties: false
display:
  group: files
  title: NotebookEdit
  show_in_status: true
