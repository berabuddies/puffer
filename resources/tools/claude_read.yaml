id: Read
name: Read
description: |-
  Reads a file from the local filesystem. You can access any file directly by using this tool.
  Assume this tool is able to read all files on the machine. If the User provides a path to a file assume that path is valid. It is okay to read a file that does not exist; an error will be returned.

  Usage:
  - The file_path parameter must be an absolute path, not a relative path
  - By default, it reads up to 2000 lines starting from the beginning of the file
  - You can optionally specify a line offset and limit (especially handy for long files), but it's recommended to read the whole file by not providing these parameters
  - Results are returned using cat -n format, with line numbers starting at 1
  - This tool allows Claude Code to read images (eg PNG, JPG, etc). When reading an image file the contents are presented visually as Claude Code is a multimodal LLM.
  - This tool can read PDF files (.pdf). For large PDFs (more than 10 pages), you MUST provide the pages parameter to read specific page ranges (e.g., pages: "1-5"). Reading a large PDF without the pages parameter will fail. Maximum 20 pages per request.
  - This tool can read Jupyter notebooks (.ipynb files) and returns all cells with their outputs, combining code, text, and visualizations.
  - This tool can only read files, not directories. To read a directory, use an ls command via the Bash tool.
  - You will regularly be asked to read screenshots. If the user provides a path to a screenshot, ALWAYS use this tool to view the file at the path. This tool will work with all temporary file paths.
  - If you read a file that exists but has empty contents you will receive a system reminder warning in place of file contents.
handler: runtime:claude_read
approval_policy: auto
sandbox_policy: read-only
contract:
  status: active
  trust_level: sandboxed
  side_effect_class: none
  reversibility: not_applicable
  idempotency: idempotent
  risk_level: low
  preconditions:
    - file_path is an absolute path.
    - target is a file or supported readable document, not a directory.
    - requested PDF page range is within the supported page limit.
  postconditions:
    - filesystem contents are unchanged.
    - requested file content or a read error is returned to the caller.
  semantic_intents:
    - intent: read_file
      slots:
        path: file_path
  verification:
    methods:
      - confirm returned content or error corresponds to the requested file_path.
      - use offset, limit, or pages for oversized files before retrying.
    required_before_completion: false
  failure_modes:
    - name: missing_path
      detection: "text_contains:no such file or directory || text_contains:path does not exist || text_contains:cannot find the path"
      repair_strategy: inspect available paths before retrying with a corrected file_path.
      confidence: 0.85
    - name: path_is_directory
      detection: "text_contains:is a directory || text_contains:path resolves to a directory"
      repair_strategy: use a directory listing or glob action instead of file read.
      confidence: 0.75
    - name: oversized_read
      detection: "text_contains:file is too large || text_contains:too large"
      repair_strategy: retry with offset, limit, or pages.
      confidence: 0.7
    - name: decode_failed
      detection: "text_contains:decoding fails || text_contains:unsupported file type"
      repair_strategy: choose a compatible reader or narrower page range.
      confidence: 0.6
  forbidden_uses:
    - modifying files or directories.
    - treating read output as proof that later filesystem state is unchanged.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: The absolute path to the file to read
    offset:
      type: integer
      description: The line number to start reading from. Only provide if the file is too large to read at once
      minimum: 0
    limit:
      type: integer
      description: The number of lines to read. Only provide if the file is too large to read at once.
      minimum: 1
    pages:
      type: string
      description: Page range for PDF files (e.g., "1-5", "3", "10-20"). Only applicable to PDF files. Maximum 20 pages per request.
  required:
    - file_path
  additionalProperties: false
display:
  group: files
  title: Read
  show_in_status: true
