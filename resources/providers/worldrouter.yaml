id: worldrouter
display_name: WorldRouter
base_url: https://inference-api.worldrouter.ai
default_api: openai-completions
oauth_family: worldrouter
auth_modes:
  - api_key
  - oauth
discovery:
  path: /v1/models
  response: open_ai_models
  api: openai-completions
  context_window: 200000
  max_output_tokens: 8192
  supports_reasoning: true
models:
  # Seed list — runtime /v1/models discovery overrides at startup.
  # Pick a couple of reasoning-capable defaults verified live 2026-05-21
  # (kimi-k2.6 and qwen3.5-flash both return 200 on /v1/chat/completions).
  - id: kimi-k2.6
    display_name: Kimi K2.6
    provider: worldrouter
    api: openai-completions
    context_window: 128000
    max_output_tokens: 8192
    supports_reasoning: true
  - id: qwen3.5-flash
    display_name: Qwen 3.5 Flash
    provider: worldrouter
    api: openai-completions
    context_window: 128000
    max_output_tokens: 8192
    supports_reasoning: true
