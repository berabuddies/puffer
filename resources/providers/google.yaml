id: google
display_name: Google
# Google Gemini exposes an OpenAI-compatible Chat Completions API. We encode the
# `/v1beta/openai` prefix in `base_url`; the openai-completions adapter otherwise
# defaults the path to `/v1/chat/completions`, which would send requests to
# `…/v1beta/openai/v1/chat/completions` (a spurious `/v1` → 404). Override it to
# `/chat/completions` so requests hit `…/v1beta/openai/chat/completions`. Auth is
# a Gemini API key sent as `Authorization: Bearer <key>`, which the
# openai-completions adapter already does.
base_url: https://generativelanguage.googleapis.com/v1beta/openai
chat_completions_path: /chat/completions
default_api: openai-completions
auth_modes:
  - api_key
# No live discovery: Google's OpenAI-compat `/v1beta/openai/models` returns ids
# with a `models/` prefix (e.g. `models/gemini-2.5-flash`), no `name` field, and
# includes embedding models with no chat filter. Merging that (discovery is
# authoritative) would drop these curated entries in favor of prefixed,
# low-metadata ones and surface embeddings as selectable chat models. Ship a
# curated static list instead; add new Gemini models here as they ship.
models:
  - id: gemini-2.5-flash
    display_name: Gemini 2.5 Flash
    provider: google
    api: openai-completions
    context_window: 1048576
    max_output_tokens: 65536
    supports_reasoning: true
  - id: gemini-2.5-pro
    display_name: Gemini 2.5 Pro
    provider: google
    api: openai-completions
    context_window: 1048576
    max_output_tokens: 65536
    supports_reasoning: true
