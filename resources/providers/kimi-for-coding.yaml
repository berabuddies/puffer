id: kimi-for-coding
display_name: Kimi for Coding
# Kimi serves the OpenAI-compatible chat/completions API under /coding/v1.
# Puffer's openai-completions api builder appends `/v1/chat/completions`, so
# the base URL has to stop at `/coding` (puffer adds the /v1 itself).
base_url: https://api.kimi.com/coding
default_api: openai-completions
auth_modes:
  - api_key
  - oauth
# Kimi's endpoint returns 403 { "access_terminated_error": ... } unless the
# request User-Agent matches a whitelisted coding agent. kimi-cli sends
# `KimiCLI/<version>`; puffer masquerades as that here. Keep the version
# in sync with `KIMI_USER_AGENT` in crates/puffer-provider-openai/src/kimi_oauth.rs
# so that both the API-key and OAuth code paths present the same fingerprint.
headers:
  User-Agent: KimiCLI/1.37.0
models:
  - id: kimi-for-coding
    display_name: Kimi for Coding (k2.6)
    provider: kimi-for-coding
    api: openai-completions
    context_window: 262144
    max_output_tokens: 32768
    supports_reasoning: true
